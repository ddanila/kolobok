name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      # Cache only the downloaded archive. Unpacking it again is fast, and the
      # unpacked toolchain is far too large to be worth moving through the cache.
      - name: Cache Open Watcom download
        uses: actions/cache@v6
        with:
          path: |
            .tools/open-watcom-linux-x64
            .tools/ow-snapshot.tar.xz
          key: watcom-${{ runner.os }}-${{ hashFiles('tools/bootstrap-watcom.sh', 'tools/watcom-env.sh') }}

      - name: Cross-compile the DOS binaries
        run: make dos

      - name: Host tests
        run: make host-test

      - name: Upload binaries
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: kolobok-dos
          path: |
            build/KOLOBOK.EXE
            build/KOLOEDIT.EXE
            build/KOLOBOK.DAT
            build/*.KLV
          if-no-files-found: error

  dos-tests:
    name: DOS-native tests (DOSBox-X)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pillow and DOSBox-X
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosbox-x
          dosbox-x -version | head -3 || true

      - name: Cache Open Watcom download
        uses: actions/cache@v6
        with:
          path: .tools/open-watcom-linux-x64
          key: watcom-${{ runner.os }}-${{ hashFiles('tools/bootstrap-watcom.sh', 'tools/watcom-env.sh') }}

      - name: Cross-compile the DOS binaries
        run: make dos

      - name: Game and editor self-tests
        run: bash tools/dosbox-test.sh

      - name: Deterministic campaign playthrough
        run: bash tools/dosbox-playtest.sh

      # Runners ship an older DOSBox-X than docs/performance.md was recorded
      # with and still reproduce its 57.4 fps exactly, so this blocks. A macOS
      # host reports about 54.5 fps for the same binary; the gate's floor of
      # 50.0 absorbs that spread.
      - name: 386DX-40 performance gate
        run: bash tools/dosbox-perf-test.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dos-test-logs
          path: build/*.LOG
          if-no-files-found: ignore
